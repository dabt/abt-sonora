<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Imagem de compartilhamento</title>
<style>
@font-face{font-family:Fraunces;src:url('../assets/fonts/fraunces-latin.woff2') format('woff2');font-weight:500 900;font-style:normal}
@font-face{font-family:Fraunces;src:url('../assets/fonts/fraunces-italic-latin.woff2') format('woff2');font-weight:500 900;font-style:italic}
@font-face{font-family:'Instrument Sans';src:url('../assets/fonts/instrument-sans-latin.woff2') format('woff2');font-weight:400 700}
*{box-sizing:border-box}
body{margin:0;width:1200px;height:630px;overflow:hidden;background:#FFC629;color:#151718;font-family:'Instrument Sans',sans-serif;position:relative}
.ring{position:absolute;right:-170px;top:-150px;width:760px;height:760px;background:#FF6B35;-webkit-mask:url(../assets/img/sulcos.svg) center/contain no-repeat;mask:url(../assets/img/sulcos.svg) center/contain no-repeat}
.dot{position:absolute;right:130px;bottom:-60px;width:260px;height:260px;border-radius:50%;background:#00B87C}
.logo{position:absolute;left:72px;top:58px;width:240px}
h1{position:absolute;left:72px;top:160px;margin:0;font:900 142px/.86 Fraunces,serif;letter-spacing:-.055em}
h1 span{display:block}
h1 .b{display:inline-block;margin:22px 0 14px 40px;background:#151718;color:#FFC629;border-radius:99px;padding:6px 30px 12px;font:italic 600 40px/1.1 Fraunces,serif;letter-spacing:-.02em}
h1 .f{font-style:italic;font-weight:800;font-size:124px}
p{position:absolute;left:350px;top:80px;margin:0;font-size:26px;font-weight:600}
</style></head>
<body><div class="ring"></div><div class="dot"></div>
<img class="logo" src="../assets/abt-sonora-horizontal-escura.svg" alt="">
<h1><span>Sua ideia.</span><span class="b">Em outra</span><span class="f">frequência.</span></h1>
<p>Jingles, trilhas e ambientes sonoros</p>
</body></html>
